name: Release

# Computes the next version from the merged PR's semver label, then builds,
# scans and pushes the image, builds the binaries and cuts the GitHub release.
# When the merged PR carries no semver label, nothing is released.
on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true

env:
  REGISTRY: quay.io
  REPOSITORY: seamware
  IMAGE_NAME: consent-owner-resolver
  BINARY_NAME: owner-resolver

jobs:
  generate-version:
    runs-on: ubuntu-latest
    # A job-level block REPLACES the inherited set, so every scope the job needs
    # must be listed: contents to check out, pull-requests to read the merged
    # PR's semver label.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_version: ${{ steps.version.outputs.has_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The merged PR's semver label decides the bump. `gh` reads it from the
      # commit -> PR association, which is what `pull-requests: read` is for.
      - name: Resolve the version to release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$EXPLICIT_VERSION" ]]; then
            echo "version=$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name')
          # No semver label means "do not release" - not a failure. check.yml
          # already requires one on every PR, so this is the direct-push path.
          if ! bump=$(./hack/semver-bump.sh <<<"$labels"); then
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$(./hack/next-version.sh "$bump")" >> "$GITHUB_OUTPUT"
          echo "has_version=true" >> "$GITHUB_OUTPUT"

  build-scan-push:
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Compile
        run: CGO_ENABLED=0 go build -trimpath -o ${{ env.BINARY_NAME }} .

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: local/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reporting run: never blocks, so the Security tab is populated even when
      # the gate below stops the build.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Blocking gate: a CRITICAL vulnerability in the image must not ship.
      # HIGH stays reporting-only - it is noisy enough on base images that
      # blocking on it would train people to bypass the gate.
      - name: Fail on CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        if: needs.generate-version.outputs.has_version == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    needs: generate-version
    if: needs.generate-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  git-release:
    needs:
      - generate-version
      - build-scan-push
      - build-binaries
    if: needs.generate-version.outputs.has_version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: owner-resolver-*
          merge-multiple: true

      # `gh release create` ships with the runner: no third-party action holds
      # `contents: write` next to the registry credentials.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            LICENSE release-assets/owner-resolver-*
