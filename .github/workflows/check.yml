name: Check PR

# Enforces that every PR carries exactly one semver label (patch/minor/major).
# The merge-to-main release uses that label to compute the next version.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `pull_request_target` checks out the BASE, never the PR head: the label
      # scripts must be the reviewed ones, not whatever the PR proposes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require exactly one semver label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          bump=$(jq -r '.[]' <<<"$LABELS" | ./hack/semver-bump.sh)
          echo "This PR would release $(./hack/next-version.sh "$bump") ($bump)."

  comment:
    needs: check
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: thollander/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa # v3
        with:
          message: "Please apply one of the following labels to the PR: `patch`, `minor`, or `major`. See [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) for details."
