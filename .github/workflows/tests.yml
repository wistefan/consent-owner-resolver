name: Tests

# Reusable test suite. The resolver has no separate integration-test module, so
# `go test ./...` is the whole suite.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      # Non-blocking: reporting needs the repository to be connected to
      # Coveralls first, and a missing token must not fail the build.
      - uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: coverage.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
