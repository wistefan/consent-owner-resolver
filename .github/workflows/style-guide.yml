name: Style Guide

# Reusable lint check using the repository's .golangci.yml - the same config
# `make lint` reads, so a local run and CI cannot disagree.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned: `latest` lets a new golangci-lint release turn the build red
          # without a code change. Dependabot does not track this input, so it is
          # bumped alongside GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.13.1
