name: Pre-Release

# Publishes a `<next>-PRE-<pr>` image and pre-release for an open PR, so the
# change can be deployed and tried before it is merged. Requires the PR to carry
# a semver label (check.yml enforces that).
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

concurrency:
  group: pre-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  REPOSITORY: wi_stefan
  IMAGE_NAME: consent-owner-resolver
  BINARY_NAME: owner-resolver

jobs:
  # The copyright headers gate the pre-release too, so an unheadered file cannot
  # be published even as a PRE image.
  license-headers:
    uses: ./.github/workflows/license-headers.yml

  generate-version:
    needs: license-headers
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        uses: zwaldowski/match-label-action@v1
        with:
          allowed: major,minor,patch

      - uses: zwaldowski/semver-release-action@v6
        with:
          dry_run: true
          bump: ${{ steps.bump.outputs.match }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set pre-release version
        id: out
        run: echo "version=${VERSION}-PRE-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

  build-scan-push:
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compile
        run: CGO_ENABLED=0 go build -trimpath -o ${{ env.BINARY_NAME }} .

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reporting run: never blocks, so the Security tab is populated even when
      # the gate below stops the build.
      - uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Blocking gate: a CRITICAL vulnerability in the image must not ship.
      # HIGH stays reporting-only - it is noisy enough on base images that
      # blocking on it would train people to bypass the gate.
      - name: Fail on CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    needs: generate-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  git-release:
    needs:
      - generate-version
      - build-scan-push
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: owner-resolver-*
          merge-multiple: true

      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ needs.generate-version.outputs.version }}
          prerelease: true
          title: ${{ needs.generate-version.outputs.version }}
          files: |
            LICENSE
            release-assets/owner-resolver-*
