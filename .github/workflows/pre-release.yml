name: Pre-Release

# Publishes a `<next>-PRE-<pr>` image and pre-release for an open PR, so the
# change can be deployed and tried before it is merged. Requires the PR to carry
# a semver label (check.yml enforces that).
#
# SAME-REPO BRANCHES ONLY. A fork PR gets neither the Quay secrets (they are
# empty) nor `contents: write`, so every job here would fail for an external
# contributor - a permanently red pipeline they cannot fix. `pr.yml` runs all
# the actual checks for forks; this workflow is a deploy convenience, so it is
# skipped rather than failed.
#
# Note this DOES publish an image built from unreviewed code to a public
# registry on every `synchronize` of a same-repo branch. That is the point of a
# preview flow, and it is a deliberate choice: pushes to this repository already
# require write access.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

concurrency:
  group: pre-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  REPOSITORY: seamware
  IMAGE_NAME: consent-owner-resolver
  BINARY_NAME: owner-resolver

jobs:
  # The copyright headers gate the pre-release too, so an unheadered file cannot
  # be published even as a PRE image.
  license-headers:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/license-headers.yml

  generate-version:
    needs: license-headers
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set pre-release version
        id: out
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bump=$(jq -r '.[]' <<<"$LABELS" | ./hack/semver-bump.sh)
          echo "version=$(./hack/next-version.sh "$bump")-PRE-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

  build-scan-push:
    needs: generate-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compile
        run: CGO_ENABLED=0 go build -trimpath -o ${{ env.BINARY_NAME }} .

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: local/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reporting run: never blocks, so the Security tab is populated even when
      # the gate below stops the build.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Blocking gate: a CRITICAL vulnerability in the image must not ship.
      # HIGH stays reporting-only - it is noisy enough on base images that
      # blocking on it would train people to bypass the gate.
      - name: Fail on CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    needs: generate-version
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: owner-resolver-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  git-release:
    needs:
      - generate-version
      - build-scan-push
      - build-binaries
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: owner-resolver-*
          merge-multiple: true

      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --prerelease \
            --generate-notes \
            --target "$GITHUB_SHA" \
            LICENSE release-assets/owner-resolver-*
